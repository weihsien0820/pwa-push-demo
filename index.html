<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA 推播通知測試</title>
    <!-- 為了在 GitHub Pages 正常運作，路徑建議用相對路徑 ./ -->
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./style.css">
    
    <!-- iOS 特有的 Meta Tags，幫助 PWA 體驗更像原生 App -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DiuLa!">
    <link rel="apple-touch-icon" href="./images/diula-logo-192.png">
</head>
<body>
    <div class="container">
        <header>
            <h1>PWA 推播測試</h1>
            <p>純前端 Web Push Notification 示範專案</p>
        </header>

        <section class="status-panel">
            <div class="status-item">
                <span>通知權限：</span>
                <span id="permission-status" class="badge">檢查中...</span>
            </div>
            <div class="status-item">
                <span>安裝狀態：</span>
                <span id="install-status" class="badge">檢查中...</span>
            </div>
        </section>

        <section class="action-panel">
            <button id="btn-request-permission" class="btn primary">申請通知權限</button>
            <button id="btn-send-notification" class="btn" disabled>發送本地測試通知</button>
            <button id="btn-schedule-notification" class="btn" disabled>5 秒後發送通知</button>
            <button id="btn-install" class="btn secondary hidden">安裝應用程式到主畫面</button>
        </section>

        <section class="log-panel">
            <h3>系統日誌</h3>
            <div id="log-container"></div>
        </section>
    </div>

    <!-- 載入主邏輯 -->
    <script src="./app.js"></script>
</body>
</html>
